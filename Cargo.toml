[package]
name = "airlow"
version = "0.1.0"
edition = "2024"
description = "Low-latency user-mode Bluetooth A2DP audio stack for Windows (WinUSB), tuned for AirPods Pro 2"
license = "LGPL-2.1-or-later"
repository = "https://github.com/jkryspin/airlow"
readme = "README.md"
keywords = ["bluetooth", "a2dp", "audio", "low-latency", "windows"]

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
rusb = "0.9.4"

[build-dependencies]
cc = "1.5.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Security"] }
